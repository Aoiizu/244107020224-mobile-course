name: ci
on:
  pull_request:
    branches: [develop, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus_notify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test