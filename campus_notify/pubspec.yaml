name: campus_notification_app
description: Campus Notification App - auth guard, secure tokens, Dio refresh, FCM deep links.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# "any" lets pub pick versions compatible with your Flutter SDK.
# After `flutter pub get`, you may pin them from pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  flutter_riverpod: ^3.4.3
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
