name: campus_notification_app
description: Campus Notification App - auth guard, secure tokens, Dio refresh, FCM deep links.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# "any" lets pub pick versions compatible with your Flutter SDK.
# After `flutter pub get`, you may pin them from pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_messaging: any
  dio: any
  flutter_secure_storage: any
  go_router: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
